<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>ריצ׳י – גישה בהזמנה</title>
<style>body{font-family:system-ui,Arial;background:#f6f8f7;display:grid;place-items:center;min-height:100vh;margin:0}.c{background:#fff;padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001;text-align:center;max-width:320px;width:90%}h1{color:#2f7d6d;margin:0 0 6px}input,button{width:100%;padding:12px;border-radius:10px;border:1px solid #ccd;font-size:16px;box-sizing:border-box;margin-top:10px}button{background:#2f7d6d;color:#fff;border:0;cursor:pointer}#e{color:#c33;min-height:20px;margin-top:8px}</style></head><body><div class="c"><h1>ריצ׳י</h1><div>הטבלה החכמה שמבינה עברית<br>גישה בהזמנה בלבד</div><input id="u" placeholder="שם משתמש" autocomplete="off"><input id="k" placeholder="קוד גישה" autocomplete="off"><button id="b">כניסה</button><div id="e"></div></div>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function go(){const g=await (await fetch('gate.json')).json();const u=document.getElementById('u').value.trim().toLowerCase();const k=document.getElementById('k').value.trim();
const rec=g.users.find(x=>x.user===u);if(!rec){document.getElementById('e').textContent='שם משתמש או קוד לא נכונים';return}
const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(u+':'+k),'PBKDF2',false,['deriveBits']);
const h=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(rec.salt),iterations:g.it,hash:'SHA-256'},key,256));
if(btoa(String.fromCharCode(...h))===rec.hash){sessionStorage.setItem('richy_ok','1');sessionStorage.setItem('richy_role',rec.role);sessionStorage.setItem('richy_user',u);location.href='app/';}else document.getElementById('e').textContent='שם משתמש או קוד לא נכונים';}
document.getElementById('b').onclick=go;document.getElementById('k').onkeydown=e=>{if(e.key==='Enter')go()};
</script></body></html>
