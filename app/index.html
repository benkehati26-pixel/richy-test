<!doctype html>
<html lang="he" dir="rtl">
<head><meta name="robots" content="noindex,nofollow"><script>if(sessionStorage.getItem("richy_ok")!=="1")location.replace("../");</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ריצ׳י – טבלה חכמה עם AI</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2f7d6d">
<link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css">
<script src="vendor/xlsx.full.min.js"></script>
</head>
<body>
<header>
  <div class="brand"><img src="icon.svg" alt=""> <b>ריצ׳י</b> <span class="sub">הטבלה שמבינה עברית</span></div>
  <div class="tools">
    <button id="undo" title="ביטול">↶</button><button id="redo" title="שחזור">↷</button>
    <button id="addRow">+ שורה</button><button id="addCol">+ עמודה</button>
    <label class="btn">📂 ייבוא<input type="file" id="importFile" accept=".csv,.xlsx,.xls" hidden></label>
    <button id="expXlsx">⬇ XLSX</button><button id="expCsv">⬇ CSV</button>
    <button id="toggleChat" class="accent">💬 צ׳אט AI</button>
  </div>
</header>
<div class="coltools" id="coltools">
  <span id="colLabel">בחר עמודה/תא</span>
  <button data-a="rename">✏️ שם</button><button data-a="sortAsc">↑ מיון</button><button data-a="sortDesc">↓ מיון</button>
  <button data-a="filter">🔎 סינון</button><button data-a="clearFilter">✖ סינון</button>
  <button data-a="highlight">🎨 הדגשה מותנית</button><button data-a="total">Σ סיכום</button>
  <button data-a="delCol">🗑 עמודה</button><button data-a="delRow">🗑 שורה</button>
  <button data-a="bold"><b>B</b></button><input type="color" id="bgColor" value="#fff3b0" title="צבע רקע לתא">
</div>
<main>
  <section id="gridWrap"><div id="filterNote"></div><table id="grid"></table></section>
  <aside id="chat">
    <div class="chathead">🤖 העוזר של ריצ׳י <label class="demo"><input type="checkbox" id="demoMode"> מצב הדגמה</label></div>
    <div class="privacy">🔒 הקבצים והטבלאות נשמרים רק בדפדפן שלך. רק מה ששולחים בבקשה (הטקסט, הקובץ המצורף וקטע מהטבלה) נשלח ל‑Gemini של Google לעיבוד.</div>
    <div id="msgs"></div>
    <div id="attached"></div>
    <form id="chatForm">
      <label class="btn clip" title="צרף קובץ">📎<input type="file" id="chatFile" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.xlsx,.xls,.csv,.txt,.docx,.md,.json" hidden></label>
      <textarea id="prompt" rows="2" placeholder="למשל: מהקובץ תעשה טבלה רק של עמודים עם סטייה מעל 5 ס״מ"></textarea>
      <button class="accent" id="send">שלח</button>
    </form>
  </aside>
</main>
<footer id="tabs"></footer>
<script type="module" src="app.js"></script>
<script>if(sessionStorage.getItem("richy_role")!=="admin"){document.addEventListener("DOMContentLoaded",()=>{["expXlsx","expCsv"].forEach(i=>{const e=document.getElementById(i);if(e)e.style.display="none"});const b=document.querySelector(".brand");if(b)b.insertAdjacentHTML("beforeend"," <span class=\"sub\">· אורח</span>")})}else{document.addEventListener("DOMContentLoaded",()=>{const b=document.querySelector(".brand");if(b)b.insertAdjacentHTML("beforeend"," <span class=\"sub\">· מנהל</span>")})}</script></body></html>
